line-length = 100
target-version = "py311"

[lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "ANN", "PL", "C4", "PIE", "RET", "ERA", "T20", "S",
]
# S603 and S607: check-tells runs git with a fixed argument list.
# ANN401: JSON values in the vector builder are Any.
ignore = ["S603", "S607", "ANN401"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"scripts/tests/*" = ["D", "PLR2004", "S101"]
